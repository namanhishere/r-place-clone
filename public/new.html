<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

        <!-- Open Graph cho Facebook, Messenger -->
        <meta property="og:title" content="FembiVN/place">
        <meta property="og:description" content="Place thập cẩm">
        <meta property="og:image" content="https://lauplace.namanhishere.com/banner.png">
        <meta property="og:url" content="https://lauplace.namanhishere.com/">
        <meta property="og:type" content="website">

    
        <!-- Twitter Card (optional, để Discord cũng lấy tốt hơn) -->
        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="FembiVN/place">
        <meta name="twitter:description" content="Place thập cẩm">
        <meta name="twitter:image" content="https://lauplace.namanhishere.com/banner.png">
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />

    <title>FembiVN/Place</title>
    <style>
        html, body {
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
            background-color: #111;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            touch-action: none; 
        }
        #place-canvas {
            display: block; cursor: crosshair;
            image-rendering: pixelated;
        }
        #top-navbar {
            position: fixed; top: 0; left: 0; width: 100%;
            padding: 10px 20px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0));
            color: white; z-index: 10; box-sizing: border-box; pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }
        #navbar-title {
            font-size: 1.2rem;
            font-weight: 600;
            padding-top: 5px;
        }
        #navbar-info-block {
            text-align: right;
        }
        #connection-status {
            font-size: 0.9rem;
            font-weight: 600;
            transition: color 0.5s ease;
        }
        #info-carousel {
            font-size: 0.8rem;
            line-height: 1.4;
            margin-top: 4px;
            min-height: 1.4em;
        }
        
        #status-bar {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: white; text-align: center; font-weight: 500;
            padding: 15px; box-sizing: border-box; z-index: 10;
            border-top: 1px solid rgba(255,255,255,0.2);
            transition: background-color 0.3s ease;
        }
        #status-bar.ready { background-color: #1a7431; }
        #status-bar.cooldown { background-color: #c1292e; }

        #color-picker-modal {
            position: fixed;
            background-color: rgba(40, 40, 40, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            padding: 15px;
            z-index: 20;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            transform: translate(-50%, -50%);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }
        #color-picker-modal.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0.9);
        }
        .modal-header {
            width: 100%; display: flex; justify-content: space-between;
            flex-direction: column; align-items: center;
            margin-bottom: 15px; color: white;
        }
        .modal-title { font-weight: 600; font-size: 1rem; }
        .modal-footer { margin-top: 10px; color: white; font-size: 0.9rem; text-align: center; }
        .color-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 280px; }
        .picker-color-box {
            width: 45px; height: 45px; border-radius: 8px;
            cursor: pointer; border: 2px solid transparent;
            transition: transform 0.2s ease;
        }
        .picker-color-box:hover { transform: scale(1.1); }

        #status-message {
            position: fixed; top: 80px; left: 50%;
            transform: translateX(-50%);
            background-color: rgba(255, 100, 100, 0.9);
            color: white; padding: 10px 20px; border-radius: 8px;
            z-index: 20; display: none;
            animation: fadeOut 4s forwards;
        }
        @keyframes fadeOut { 0% { opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

        /* --- NEW Autoplacer Panel Styles --- */
        #autoplacer-panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 15;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        #autoplacer-toggle-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #333;
            border: 2px solid #555;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.2s ease, background-color 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
        #autoplacer-toggle-btn:hover {
            background-color: #444;
            transform: scale(1.1);
        }
        #autoplacer-toggle-btn svg {
            width: 24px;
            height: 24px;
        }
        #autoplacer-content {
            background-color: rgba(40, 40, 40, 0.95);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #555;
            margin-top: 10px;
            pointer-events: auto;
            width: 250px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transform-origin: bottom left;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }
        #autoplacer-panel.closed #autoplacer-content {
            transform: scale(0);
            opacity: 0;
            pointer-events: none;
        }
        .autoplacer-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 12px;
            font-size: 0.9rem;
        }
        .autoplacer-row label {
            font-weight: 600;
            margin-bottom: 5px;
            color: #ddd;
        }
        .autoplacer-row span, .autoplacer-row input, .autoplacer-row select, .autoplacer-row button {
            background-color: #222;
            color: white;
            border: 1px solid #555;
            border-radius: 5px;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
        }
        .autoplacer-row button, .upload-label {
            background-color: #4CAF50;
            cursor: pointer;
            text-align: center;
            font-weight: bold;
        }
        .autoplacer-row button:hover, .upload-label:hover {
            background-color: #45a049;
        }
        .autoplacer-row input[type="file"] {
            display: none;
        }
    </style>
</head>
<body>
    <div id="top-navbar">
        <span id="navbar-title">FembiVN/Place <span style="font-size: 0.8rem; font-weight: normal;">(Dev Session)</span></span>
        <div id="navbar-info-block">
            <div id="connection-status">Đang kết nối...</div>
            <div id="info-carousel"></div>
        </div>
    </div>

    <canvas id="place-canvas"></canvas>
    <div id="status-bar">Đang tải...</div>
    <div id="color-picker-modal" class="hidden"></div>
    <div id="status-message"></div>

    <!-- NEW Autoplacer Panel -->
    <div id="autoplacer-panel" class="closed">
        <div id="autoplacer-toggle-btn">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
            </svg>
        </div>
        <div id="autoplacer-content">
            <div class="autoplacer-row">
                <input type="file" id="image-uploader" accept="image/*">
                <label for="image-uploader" class="upload-label">Upload Image</label>
            </div>
            <div class="autoplacer-row">
                <label>Size:</label>
                <input type="range" id="size-slider" min="10" max="500" value="100">
            </div>
             <div class="autoplacer-row">
                <label for="placement-method">Method:</label>
                <select id="placement-method">
                    <option value="left-to-right">Left to Right</option>
                    <option value="random">Random</option>
                </select>
            </div>
            <div class="autoplacer-row">
                <label>Pixels to Place:</label>
                <span id="pixels-to-place-stat">N/A</span>
            </div>
             <div class="autoplacer-row">
                <label>Time Elapsed:</label>
                <span id="time-elapsed-stat">N/A</span>
            </div>
             <div class="autoplacer-row">
                <label>Est. Time Remaining:</label>
                <span id="time-remaining-stat">N/A</span>
            </div>
            <div class="autoplacer-row">
                <button id="place-image-btn">Place Image</button>
            </div>
            <div class="autoplacer-row">
                 <button id="toggle-preview-btn">Toggle Preview</button>
            </div>
        </div>
    </div>

    <script>
        // --- DOM Elements ---
        const canvas = document.getElementById('place-canvas');
        const ctx = canvas.getContext('2d');
        const statusBar = document.getElementById('status-bar');
        const colorPickerModal = document.getElementById('color-picker-modal');
        const statusMessageEl = document.getElementById('status-message');
        const connectionStatusEl = document.getElementById('connection-status');
        const infoCarouselEl = document.getElementById('info-carousel');
        
        // --- NEW Autoplacer Panel Elements ---
        const autoplacerPanel = document.getElementById('autoplacer-panel');
        const autoplacerToggleBtn = document.getElementById('autoplacer-toggle-btn');
        const imageUploader = document.getElementById('image-uploader');
        const togglePreviewBtn = document.getElementById('toggle-preview-btn');
        const sizeSlider = document.getElementById('size-slider');
        const placeImageBtn = document.getElementById('place-image-btn');
        const placementMethodSelect = document.getElementById('placement-method');
        const pixelsToPlaceStat = document.getElementById('pixels-to-place-stat');
        const timeElapsedStat = document.getElementById('time-elapsed-stat');
        const timeRemainingStat = document.getElementById('time-remaining-stat');


        // --- Constants & State ---
        const WEBSOCKET_URL = `wss://${window.location.host}`;
        const GRID_WIDTH = 960;
        const GRID_HEIGHT = 540;
        const PIXEL_SIZE = 1;
        const COLORS = [
            '#FF4500', '#FFA800', '#FFD635', '#00A368',
            '#7EED56', '#2450A4', '#3690EA', '#51E9F4',
            '#811E9F', '#B44AC0', '#FF99AA', '#9C6926',
            '#000000', '#898D90', '#D4D7D9', '#FFFFFF'
        ];
        const COLORS_RGB = COLORS.map(hex => ({
            r: parseInt(hex.slice(1, 3), 16),
            g: parseInt(hex.slice(3, 5), 16),
            b: parseInt(hex.slice(5, 7), 16)
        }));

        let scale = 10, offsetX = 0, offsetY = 0;
        let isPanning = false, panStart = { x: 0, y: 0 }, lastTouchDistance = null;
        let hasDragged = false;
        let gridData = [];
        let ws;
        let selectedCoords = null;
        let cooldownEndTime = 0;
        let cooldownIntervalId = null;
        let COOLDOWN_SECONDS = 1;

        let infoCarouselIntervalId = null;
        let currentInfoIndex = 0;
        let clientIp = '';
        let onlineCount = 0;
        let eventEndDate = null;

        // --- Autoplacer State ---
        let autoplacerImage = null;
        let autoplacerData = null;
        let previewVisible = false;
        let autoplaceTopLeft = { x: 0, y: 0 };
        let autoplaceSize = 100;
        let placementInterval = null;
        let statsInterval = null;
        let pixelQueue = [];

        // --- WebSocket & Core Logic (remains mostly the same) ---
        function connect() {
            console.log(`Connecting to ${WEBSOCKET_URL}...`);
            connectionStatusEl.textContent = 'Đang kết nối...';
            connectionStatusEl.style.color = 'white';
            ws = new WebSocket(WEBSOCKET_URL);

            ws.onopen = () => {
                console.log("WebSocket connected!");
                connectionStatusEl.textContent = 'Đã kết nối';
                connectionStatusEl.style.color = '#7EED56'; // Green
            };
            ws.onclose = () => {
                connectionStatusEl.textContent = "Mất kết nối";
                connectionStatusEl.style.color = '#FF4500'; // Red
                infoCarouselEl.textContent = ''; // Clear info text
                if (infoCarouselIntervalId) {
                    clearInterval(infoCarouselIntervalId);
                    infoCarouselIntervalId = null;
                }
                setTimeout(connect, 3000);
            };
            ws.onerror = (err) => {
                console.error("WebSocket Error:", err);
                ws.close();
            };
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                switch (msg.type) {
                    case 'INIT_DATA':
                        gridData = msg.payload.grid;
                        COOLDOWN_SECONDS = msg?.payload?.cooldownSeconds || COOLDOWN_SECONDS;
                        clientIp         = msg?.payload?.clientIp         || clientIp;
                        onlineCount      = msg?.payload?.numOfClients     || onlineCount;
                        eventEndDate     = new Date(msg?.payload?.endDate || eventEndDate);

                        const initialCooldown = msg.payload.cooldownEnds;
                        if (initialCooldown > 0) {
                            cooldownEndTime = Date.now() + initialCooldown * 1000;
                            if (!cooldownIntervalId) {
                                cooldownIntervalId = setInterval(updateStatusUI, 1000);
                            }
                        }
                        
                        initializeAndStartCarousel();
                        updateStatusUI();
                        break;
                    case 'PIXEL_UPDATE':
                        gridData[msg.payload.y][msg.payload.x] = msg.payload.colorIndex;
                        break;
                    case 'ONLINE_COUNT_UPDATE':
                        onlineCount = msg.payload.numOfClients;
                        break;
                    case 'COOLDOWN_START':
                        cooldownEndTime = Date.now() + COOLDOWN_SECONDS * 1000;
                        updateStatusUI();
                        if (!cooldownIntervalId) {
                            cooldownIntervalId = setInterval(updateStatusUI, 1000);
                        }
                        break;
                    case 'ERROR':
                        showStatusMessage(msg.payload);
                        break;
                }
            };
        }
        
        // --- Info Carousel, UI, Drawing, and Pointer Handlers (remain the same) ---
        let countdownInterval = null;

        function getCountdownString() {
            if (!eventEndDate) return "Sự kiện đã kết thúc!";
            const diff = eventEndDate - new Date();
            if (diff <= 0) {
                return "Sự kiện đã kết thúc!";
            }
            const d = Math.floor(diff / 864e5),
                  h = Math.floor(diff % 864e5 / 36e5),
                  m = Math.floor(diff % 36e5 / 6e4),
                  s = Math.floor(diff % 6e4 / 1e3);
            return `Kết thúc sau: ${d}d ${h}h ${m}m ${s}s`;
        }

        function updateCarouselInfo() {
            if (countdownInterval) {
                clearInterval(countdownInterval);
                countdownInterval = null;
            }

            const infoData = [
                'countdown_placeholder',
                `Số kết nối trực tuyến: ${onlineCount}`,
                `IP của bạn: ${clientIp}`,
            ];

            const currentInfoItem = infoData[currentInfoIndex];

            if (currentInfoItem === 'countdown_placeholder') {
                infoCarouselEl.textContent = getCountdownString();
                countdownInterval = setInterval(() => {
                    infoCarouselEl.textContent = getCountdownString();
                }, 1000);
            } else {
                infoCarouselEl.textContent = currentInfoItem;
            }
            currentInfoIndex = (currentInfoIndex + 1) % infoData.length;
        }

        function initializeAndStartCarousel() {
            if (infoCarouselIntervalId) {
                clearInterval(infoCarouselIntervalId);
            }
            currentInfoIndex = 0;
            updateCarouselInfo();
            infoCarouselIntervalId = setInterval(updateCarouselInfo, 5000);
        }

        function showStatusMessage(text) {
            statusMessageEl.textContent = text;
            statusMessageEl.style.display = 'block';
            setTimeout(() => { statusMessageEl.style.display = 'none'; }, 4000);
        }

        function updateStatusUI() {
            const now = Date.now();
            if (now < cooldownEndTime) {
                const remaining = Math.ceil((cooldownEndTime - now) / 1000);
                statusBar.textContent = `Vui lòng chờ: ${remaining} giây`;
                statusBar.className = 'cooldown';
            } else {
                statusBar.textContent = 'Nhấn vào một ô để đặt màu';
                statusBar.className = 'ready';
                if (cooldownIntervalId) {
                    clearInterval(cooldownIntervalId);
                    cooldownIntervalId = null;
                }
            }
        }

        function showColorPicker(screenX, screenY) {
            hideColorPicker();
            colorPickerModal.innerHTML = `
                <div class="modal-header">
                    <span class="modal-title">Hãy chọn màu</span>
                    <span class="modal-footer">Tòa độ: (${selectedCoords.x}, ${selectedCoords.y})</span>
                </div>
                <div class="color-grid"></div>
            `;
            const colorGrid = colorPickerModal.querySelector('.color-grid');
            
            COLORS.forEach((color, index) => {
                const colorBox = document.createElement('div');
                colorBox.className = 'picker-color-box';
                colorBox.style.backgroundColor = color;
                colorBox.onclick = () => {
                    sendPlacePixelRequest(index);
                    hideColorPicker();
                };
                colorGrid.appendChild(colorBox);
            });

            const modalWidth = 280;
            const modalHeight = 180; 
            let left = Math.max((modalWidth/2), Math.min(screenX, window.innerWidth - (modalWidth/2)));
            let top = Math.max(0, Math.min(screenY, window.innerHeight - modalHeight));

            colorPickerModal.style.left = `${left}px`;
            colorPickerModal.style.top = `${top}px`;
            colorPickerModal.classList.remove('hidden');
        }

        function hideColorPicker() {
            if (!colorPickerModal.classList.contains('hidden')) {
                colorPickerModal.classList.add('hidden');
            }
        }

        function sendPlacePixelRequest(colorIndex, x, y) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                showStatusMessage("Mất kết nối tới server.");
                return;
            }
            const coords = (x !== undefined && y !== undefined) ? {x, y} : selectedCoords;
            if (coords) {
                ws.send(JSON.stringify({
                    type: 'PLACE_PIXEL',
                    payload: { x: coords.x, y: coords.y, colorIndex }
                }));
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.translate(offsetX, offsetY);
            ctx.scale(scale, scale);
            
            if (gridData.length > 0) {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, GRID_WIDTH, GRID_HEIGHT);
                const view = { x: -offsetX / scale, y: -offsetY / scale, width: canvas.width / scale, height: canvas.height / scale };
                const startCol = Math.max(0, Math.floor(view.x));
                const endCol = Math.min(GRID_WIDTH, Math.ceil(view.x + view.width));
                const startRow = Math.max(0, Math.floor(view.y));
                const endRow = Math.min(GRID_HEIGHT, Math.ceil(view.y + view.height));
                for (let row = startRow; row < endRow; row++) {
                    for (let col = startCol; col < endCol; col++) {
                        if (gridData[row] && gridData[row][col] !== 15) {
                            ctx.fillStyle = COLORS[gridData[row][col]];
                            ctx.fillRect(col * PIXEL_SIZE, row * PIXEL_SIZE, PIXEL_SIZE, PIXEL_SIZE);
                        }
                    }
                }
                if (scale > 20) {
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
                    ctx.lineWidth = 1 / scale;
                    for (let i = startCol; i <= endCol; i++) { ctx.beginPath(); ctx.moveTo(i, startRow); ctx.lineTo(i, endRow); ctx.stroke(); }
                    for (let i = startRow; i <= endRow; i++) { ctx.beginPath(); ctx.moveTo(startCol, i); ctx.lineTo(endCol, i); ctx.stroke(); }
                }
            }

            if (previewVisible && autoplacerData) {
                ctx.globalAlpha = 0.75;
                for (let y = 0; y < autoplacerData.height; y++) {
                    for (let x = 0; x < autoplacerData.width; x++) {
                        const colorIndex = autoplacerData.data[y * autoplacerData.width + x];
                        if (colorIndex !== null) {
                            ctx.fillStyle = COLORS[colorIndex];
                            ctx.fillRect(autoplaceTopLeft.x + x, autoplaceTopLeft.y + y, 1, 1);
                        }
                    }
                }
                ctx.globalAlpha = 1.0;
            }

            ctx.restore();
            requestAnimationFrame(draw);
        }

        function onPointerDown(e) {
            hideColorPicker();
            hasDragged = false; 
            if (e.touches && e.touches.length > 1) {
                isPanning = false; 
                return;
            }
            isPanning = true;
            panStart = getEventLocation(e);
        }

        function onPointerMove(e) {
            if (e.touches && e.touches.length === 2) {
                isPanning = false;
                hasDragged = true; 
                const p1 = e.touches[0], p2 = e.touches[1];
                const currentDist = Math.hypot(p1.clientX - p2.clientX, p1.clientY - p2.clientY);
                const midPoint = { x: (p1.clientX + p2.clientX) / 2, y: (p1.clientY + p2.clientY) / 2 };
                if (lastTouchDistance !== null) {
                    const zoom = currentDist / lastTouchDistance;
                    const worldPos = screenToWorld(midPoint.x, midPoint.y);
                    const newScale = Math.max(2, Math.min(scale * zoom, 100));
                    offsetX = midPoint.x - worldPos.x * newScale;
                    offsetY = midPoint.y - worldPos.y * newScale;
                    scale = newScale;
                    clampOffsets();
                }
                lastTouchDistance = currentDist;
                return;
            }

            if (!isPanning) return;
            
            const currentPos = getEventLocation(e);
            const distance = Math.hypot(currentPos.x - panStart.x, currentPos.y - panStart.y);

            if (distance > 5) {
                hasDragged = true;
            }
            
            if (isPanning && hasDragged) {
                offsetX += currentPos.x - panStart.x;
                offsetY += currentPos.y - panStart.y;
                clampOffsets();
                panStart = currentPos;
            }
        }

        function onPointerUp(e) {
            if (!hasDragged) {
                const endPos = getEventLocation(e.changedTouches ? e.changedTouches[0] : e);
                const worldPos = screenToWorld(endPos.x, endPos.y);
                selectedCoords = { x: Math.floor(worldPos.x), y: Math.floor(worldPos.y) };

                if (autoplacerImage) {
                    autoplaceTopLeft = { x: selectedCoords.x, y: selectedCoords.y };
                    previewVisible = true;
                    showStatusMessage(`Top-left set to (${autoplaceTopLeft.x}, ${autoplaceTopLeft.y}). Toggle preview.`);
                } else {
                     if (Date.now() < cooldownEndTime) {
                        showStatusMessage("Vui lòng chờ cooldown kết thúc.");
                        return;
                    }
                    showColorPicker(endPos.x, endPos.y);
                }
            }
            isPanning = false;
            lastTouchDistance = null;
        }

        function onWheel(e) {
            e.preventDefault();
            hideColorPicker();
            const zoomIntensity = 0.1;
            const wheel = e.deltaY < 0 ? 1 : -1;
            const zoom = Math.exp(wheel * zoomIntensity);
            const mousePos = getEventLocation(e);
            const worldPos = screenToWorld(mousePos.x, mousePos.y);
            const newScale = Math.max(2, Math.min(scale * zoom, 100));
            
            offsetX = mousePos.x - worldPos.x * newScale;
            offsetY = mousePos.y - worldPos.y * newScale;
            scale = newScale;
            clampOffsets();
        }

        // --- Autoplacer Functions (Updated) ---
        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    autoplacerImage = new Image();
                    autoplacerImage.onload = () => {
                        processImageForAutoplace();
                        showStatusMessage("Image loaded. Click on canvas to set top-left.");
                    };
                    autoplacerImage.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function processImageForAutoplace() {
            if (!autoplacerImage) return;

            const aspectRatio = autoplacerImage.width / autoplacerImage.height;
            const newWidth = autoplaceSize;
            const newHeight = Math.round(autoplaceSize / aspectRatio);

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');
            tempCanvas.width = newWidth;
            tempCanvas.height = newHeight;
            tempCtx.drawImage(autoplacerImage, 0, 0, newWidth, newHeight);

            const imageData = tempCtx.getImageData(0, 0, newWidth, newHeight);
            const pixels = imageData.data;
            const ditheredData = [];

            let pixelsFloat = new Float32Array(pixels.length);
            for(let i = 0; i < pixels.length; i++) pixelsFloat[i] = pixels[i];

            for (let y = 0; y < newHeight; y++) {
                for (let x = 0; x < newWidth; x++) {
                    const i = (y * newWidth + x) * 4;
                    if (pixelsFloat[i + 3] < 128) {
                        ditheredData.push(null);
                        continue;
                    }
                    
                    const oldR = pixelsFloat[i], oldG = pixelsFloat[i + 1], oldB = pixelsFloat[i + 2];
                    const colorIndex = findClosestColorIndex(oldR, oldG, oldB);
                    ditheredData.push(colorIndex);
                    const newColor = COLORS_RGB[colorIndex];
                    const errR = oldR - newColor.r, errG = oldG - newColor.g, errB = oldB - newColor.b;

                    const distributeError = (dx, dy, factor) => {
                        if (x + dx >= 0 && x + dx < newWidth && y + dy >= 0 && y + dy < newHeight) {
                            const di = ((y + dy) * newWidth + (x + dx)) * 4;
                            pixelsFloat[di]     = Math.max(0, Math.min(255, pixelsFloat[di]     + errR * factor));
                            pixelsFloat[di + 1] = Math.max(0, Math.min(255, pixelsFloat[di + 1] + errG * factor));
                            pixelsFloat[di + 2] = Math.max(0, Math.min(255, pixelsFloat[di + 2] + errB * factor));
                        }
                    };

                    distributeError(1, 0, 7 / 16);
                    distributeError(-1, 1, 3 / 16);
                    distributeError(0, 1, 5 / 16);
                    distributeError(1, 1, 1 / 16);
                }
            }
            
            autoplacerData = { width: newWidth, height: newHeight, data: ditheredData };
        }

        function findClosestColorIndex(r, g, b) {
            let closestIndex = 0, minDistance = Infinity;
            for (let i = 0; i < COLORS_RGB.length; i++) {
                const c = COLORS_RGB[i];
                const distance = Math.pow(r - c.r, 2) + Math.pow(g - c.g, 2) + Math.pow(b - c.b, 2);
                if (distance < minDistance) {
                    minDistance = distance;
                    closestIndex = i;
                }
            }
            return closestIndex;
        }

        function startAutoplacing() {
            if (!autoplacerData) {
                showStatusMessage("No image data to place.");
                return;
            }
            if (placementInterval) {
                showStatusMessage("Placement already in progress.");
                return;
            }

            pixelQueue = [];
            for (let y = 0; y < autoplacerData.height; y++) {
                for (let x = 0; x < autoplacerData.width; x++) {
                    const colorIndex = autoplacerData.data[y * autoplacerData.width + x];
                    if (colorIndex !== null) {
                        const gridX = autoplaceTopLeft.x + x;
                        const gridY = autoplaceTopLeft.y + y;
                        
                        if (gridX >= 0 && gridX < GRID_WIDTH && gridY >= 0 && gridY < GRID_HEIGHT) {
                           if(!gridData[gridY] || gridData[gridY][gridX] !== colorIndex) {
                                pixelQueue.push({x: gridX, y: gridY, colorIndex});
                           }
                        }
                    }
                }
            }
            
            if(pixelQueue.length === 0) {
                showStatusMessage("Image is already placed correctly!");
                return;
            }

            // Handle placement method
            if (placementMethodSelect.value === 'random') {
                pixelQueue.sort(() => Math.random() - 0.5);
            }
            
            showStatusMessage(`Queueing ${pixelQueue.length} pixels to place...`);
            const startTime = Date.now();

            // Stats updater
            statsInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const remainingSeconds = pixelQueue.length * (COOLDOWN_SECONDS + 0.2); // Add a small buffer
                
                timeElapsedStat.textContent = `${Math.floor(elapsed / 60)}m ${elapsed % 60}s`;
                pixelsToPlaceStat.textContent = pixelQueue.length;
                timeRemainingStat.textContent = `~${Math.floor(remainingSeconds / 60)}m ${Math.round(remainingSeconds % 60)}s`;
            }, 1000);

            // Pixel placer
            placementInterval = setInterval(() => {
                if (Date.now() > cooldownEndTime) {
                    if(pixelQueue.length > 0) {
                        const pixel = pixelQueue.shift();
                        sendPlacePixelRequest(pixel.colorIndex, pixel.x, pixel.y);
                    } else {
                        clearInterval(placementInterval);
                        clearInterval(statsInterval);
                        placementInterval = null;
                        statsInterval = null;
                        showStatusMessage("Autoplace finished!");
                        pixelsToPlaceStat.textContent = "0";
                        timeRemainingStat.textContent = "Done";
                    }
                }
            }, 200);
        }

        // --- Utility & Setup Functions ---
        const screenToWorld = (x, y) => ({ x: (x - offsetX) / scale, y: (y - offsetY) / scale });
        const getEventLocation = (e) => e.touches && e.touches.length >= 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY };
        function clampOffsets() { const m = 50; const wx = GRID_WIDTH * scale, wy = GRID_HEIGHT * scale; offsetX = Math.max(-wx + m, Math.min(canvas.width - m, offsetX)); offsetY = Math.max(-wy + m, Math.min(canvas.height - m, offsetY)); }
        function setupCanvas() { 
            canvas.width = window.innerWidth; 
            canvas.height = window.innerHeight; 
            clampOffsets(); 
        }
        
        // --- Event Listeners ---
        canvas.addEventListener('wheel', onWheel, { passive: false });
        canvas.addEventListener('mousedown', onPointerDown);
        canvas.addEventListener('mousemove', onPointerMove);
        canvas.addEventListener('mouseup', onPointerUp);
        canvas.addEventListener('mouseleave', () => { isPanning = false; });
        canvas.addEventListener('touchstart', onPointerDown, { passive: false });
        canvas.addEventListener('touchmove', onPointerMove, { passive: false });
        canvas.addEventListener('touchend', onPointerUp);
        window.addEventListener('resize', setupCanvas);

        // Autoplacer listeners
        autoplacerToggleBtn.addEventListener('click', () => autoplacerPanel.classList.toggle('closed'));
        imageUploader.addEventListener('change', handleImageUpload);
        togglePreviewBtn.addEventListener('click', () => {
            if(autoplacerImage) previewVisible = !previewVisible;
        });
        sizeSlider.addEventListener('input', (e) => {
            autoplaceSize = parseInt(e.target.value, 10);
            processImageForAutoplace();
        });
        placeImageBtn.addEventListener('click', startAutoplacing);


        // --- Initialisation ---
        setupCanvas();
        connect();
        draw();
    </script>
</body>
</html>
